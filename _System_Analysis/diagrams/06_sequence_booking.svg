="10" fill="#EAF2FF" stroke="#9FB7D2" stroke-width="2"/><text x="435.0" y="175" text-anchor="middle" fill="#223247" font-family="Arial" font-size="14" font-weight="700">Web UI</text><text x="352" y="199" fill="#223247" font-family="Arial" font-size="11"></text><rect x="610" y="150" width="190" height="65" rx="10" fill="#EAF8F6" stroke="#9FB7D2" stroke-width="2"/><text x="705.0" y="175" text-anchor="middle" fill="#223247" font-family="Arial" font-size="14" font-weight="700">Bookings API</text><text x="622" y="199" fill="#223247" font-family="Arial" font-size="11"></text><rect x="880" y="150" width="190" height="65" rx="10" fill="#EAF8F6" stroke="#9FB7D2" stroke-width="2"/><text x="975.0" y="175" text-anchor="middle" fill="#223247" font-family="Arial" font-size="14" font-weight="700">Booking Service</text><text x="892" y="199" fill="#223247" font-family="Arial" font-size="11"></text><rect x="1150" y="150" width="190" height="65" rx="10" fill="#FFF7EB" stroke="#9FB7D2" stroke-width="2"/><text x="1245.0" y="175" text-anchor="middle" fill="#223247" font-family="Arial" font-size="14" font-weight="700">SQL Server</text><text x="1162" y="199" fill="#223247" font-family="Arial" font-size="11"></text><rect x="1440" y="150" width="190" height="65" rx="10" fill="#F4F0FF" stroke="#9FB7D2" stroke-width="2"/><text x="1535.0" y="175" text-anchor="middle" fill="#223247" font-family="Arial" font-size="14" font-weight="700">Company User</text><text x="1452" y="199" fill="#223247" font-family="Arial" font-size="11"></text><rect x="164" y="245" width="2" height="800" rx="10" fill="#B7C5D4" stroke="#B7C5D4" stroke-width="2"/><text x="165.0" y="270" text-anchor="middle" fill="#223247" font-family="Arial" font-size="1" font-weight="700"></text><text x="176" y="294" fill="#223247" font-family="Arial" font-size="11"></text><rect x="434" y="245" width="2" height="800" rx="10" fill="#B7C5D4" stroke="#B7C5D4" stroke-width="2"/><text x="435.0" y="270" text-anchor="middle" fill="#223247" font-family="Arial" font-size="1" font-weight="700"></text><text x="446" y="294" fill="#223247" font-family="Arial" font-size="11"></text><rect x="704" y="245" width="2" height="800" rx="10" fill="#B7C5D4" stroke="#B7C5D4" stroke-width="2"/><text x="705.0" y="270" text-anchor="middle" fill="#223247" font-family="Arial" font-size="1" font-weight="700"></text><text x="716" y="294" fill="#223247" font-family="Arial" font-size="11"></text><rect x="974" y="245" width="2" height="800" rx="10" fill="#B7C5D4" stroke="#B7C5D4" stroke-width="2"/><text x="975.0" y="270" text-anchor="middle" fill="#223247" font-family="Arial" font-size="1" font-weight="700"></text><text x="986" y="294" fill="#223247" font-family="Arial" font-size="11"></text><rect x="1244" y="245" width="2" height="800" rx="10" fill="#B7C5D4" stroke="#B7C5D4" stroke-width="2"/><text x="1245.0" y="270" text-anchor="middle" fill="#223247" font-family="Arial" font-size="1" font-weight="700"></text><text x="1256" y="294" fill="#223247" font-family="Arial" font-size="11"></text><rect x="1534" y="245" width="2" height="800" rx="10" fill="#B7C5D4" stroke="#B7C5D4" stroke-width="2"/><text x="1535.0" y="270" text-anchor="middle" fill="#223247" font-family="Arial" font-size="1" font-weight="700"></text><text x="1546" y="294" fill="#223247" font-family="Arial" font-size="11"></text><rect x="343.3" y="280" width="183.4" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="435.0" y="294" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">1. Select departure + count</text><rect x="631.9" y="319" width="146.20000000000002" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="705.0" y="333" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">2. POST /api/bookings</text><rect x="898.8" y="358" width="152.4" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="975.0" y="372" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">3. Validate DTO + auth</text><rect x="1159.5" y="397" width="171.0" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="1245.0" y="411" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">4. Load departure + price</text><rect x="892.6" y="436" width="164.8" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="975.0" y="450" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">5. Return departure data</text><rect x="1049.0" y="541" width="195.8" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="1053.0" y="555" text-anchor="start" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">6. Compute total; set Pending</text><rect x="1131.6" y="514" width="226.8" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="1245.0" y="528" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">7. INSERT booking + price snapshot</text><rect x="901.9" y="553" width="146.20000000000002" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="975.0" y="567" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">8. Commit transaction</text><rect x="604.0" y="592" width="202.0" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="705.0" y="606" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">9. Return booking ID + Pending</text><rect x="349.5" y="631" width="171.0" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="435.0" y="645" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">10. Show submitted status</text><rect x="607.1" y="670" width="195.8" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="705.0" y="684" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">11. Company reviews + decides</text><rect x="883.3" y="709" width="183.4" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="975.0" y="723" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">12. Authorize company scope</text><rect x="1153.3" y="748" width="183.4" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="1245.0" y="762" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">13. Recheck available seats</text><rect x="889.5" y="787" width="171.0" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="975.0" y="801" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">14. Return capacity state</text><rect x="1137.8" y="826" width="214.4" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="1245.0" y="840" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">15. Set Confirmed if capacity OK</text><rect x="892.6" y="865" width="164.8" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="975.0" y="879" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">16. Commit status update</text><rect x="600.9" y="904" width="208.20000000000002" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="705.0" y="918" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">17. Return Confirmed / conflict</text><rect x="1443.3" y="943" width="183.4" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="1535.0" y="957" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">18. Display decision result</text><rect x="343.3" y="982" width="183.4" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="435.0" y="996" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">19. Refresh traveler status</text><text x="42" y="1176" fill="#62748A" font-family="Arial" font-size="12">Pending requests do not automatically reserve seats in this MVP. Capacity is checked again atomically when the company confirms the request.</text><text x="42" y="1159" fill="#62748A" font-family="Arial" font-size="12">If capacity is insufficient or another request consumes the remaining seats first, the confirmation is rejected with a clear conflict response.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62748A"/></marker></defs></svg>