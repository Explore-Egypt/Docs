dth="2"/><path d="M322,350 H558 Q570,350 570,362 V388 H310 V362 Q310,350 322,350Z" fill="#2D6CDF"/><text x="324" y="375" fill="#FFFFFF" font-family="Arial" font-size="17" font-weight="700">Pending</text><text x="324" y="408" fill="#223247" font-family="Arial" font-size="11">Request submitted; awaiting company decision</text><rect x="800" y="150" width="280" height="130" rx="12" fill="#EAF8F0" stroke="#2F855A" stroke-width="2"/><path d="M812,150 H1068 Q1080,150 1080,162 V188 H800 V162 Q800,150 812,150Z" fill="#2F855A"/><text x="814" y="175" fill="#FFFFFF" font-family="Arial" font-size="17" font-weight="700">Confirmed</text><text x="814" y="208" fill="#223247" font-family="Arial" font-size="12">Company accepted; seats allocated</text><rect x="800" y="390" width="280" height="130" rx="12" fill="#FFF1F1" stroke="#C94A4A" stroke-width="2"/><path d="M812,390 H1068 Q1080,390 1080,402 V428 H800 V402 Q800,390 812,390Z" fill="#C94A4A"/><text x="814" y="415" fill="#FFFFFF" font-family="Arial" font-size="17" font-weight="700">Rejected</text><text x="814" y="448" fill="#223247" font-family="Arial" font-size="12">Company declined the request</text><rect x="1190" y="390" width="250" height="130" rx="12" fill="#FFF7EA" stroke="#D97706" stroke-width="2"/><path d="M1202,390 H1428 Q1440,390 1440,402 V428 H1190 V402 Q1190,390 1202,390Z" fill="#D97706"/><text x="1204" y="415" fill="#FFFFFF" font-family="Arial" font-size="17" font-weight="700">Cancelled</text><text x="1204" y="448" fill="#223247" font-family="Arial" font-size="12">Cancellation allowed by policy</text><ellipse cx="1470.0" cy="440.0" rx="20.0" ry="20.0" fill="#14263D" stroke="#14263D" stroke-width="2"/><text x="1470.0" y="445.0" text-anchor="middle" fill="#223247" font-family="Arial" font-size="14" font-weight="600"></text><rect x="183.6" y="385.0" width="102.8" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="235.0" y="399.0" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">create request</text><rect x="587.1" y="185.0" width="195.8" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="685.0" y="199.0" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">company accepts + capacity OK</text><rect x="630.5" y="425.0" width="109.0" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="685.0" y="439.0" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">company rejects</text><rect x="769.7" y="425.0" width="220.6" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="880.0" y="439.0" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">traveler/admin cancels per policy</text><rect x="1144.0" y="443.0" width="152.4" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="1148.0" y="457.0" text-anchor="start" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">cancellation permitted</text><rect x="1232.2" y="410.0" width="65.6" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="1265.0" y="424.0" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">terminal</text><rect x="1454.0" y="428.0" width="65.6" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="1458.0" y="442.0" text-anchor="start" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">terminal</text><text x="42" y="876" fill="#62748A" font-family="Arial" font-size="12">Disallowed transitions (e.g., Rejected → Confirmed, Cancelled → Pending) must be rejected. Exact cancellation rules should be confirmed by the team/instructor.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62748A"/></marker></defs></svg>