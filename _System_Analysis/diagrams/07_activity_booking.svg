">Seats available</text><rect x="646.2" y="1267.5" width="127.60000000000001" height="21" rx="6" fill="#FFFFFF" stroke="#D8E2ED"/><text x="710.0" y="1281.5" text-anchor="middle" fill="#223247" font-family="Arial" font-size="10.5" font-weight="700">Insufficient seats</text><text x="42" y="1426" fill="#62748A" font-family="Arial" font-size="12">The platform does not collect payment in the MVP. Booking confirmation is a company decision subject to departure capacity; it is not proof of payment.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62748A"/></marker></defs></svg>